<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Grid Layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: Arial, sans-serif; }

  .wrapper {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: auto auto auto auto;
    gap: 3px;
    max-width: 1200px;
    margin: auto;
    padding: 3px;
  }

  .block { border: 1px solid #ccc; }

  .header  { grid-column: 1 / 3; background: #4f9adf; height: 160px; }
  .cyan    { background: #5fd7cf; }
  .red     { background: #e06b6b; }
  .yellow  { background: #ffc400; grid-row: 2 / 4; }
  .green   { background: #1f9b6f; grid-column: 1; }
  .sidebar { background: #66696b; grid-column: 2; grid-row: 1 / 4; }
  .footer  { grid-column: 1 / 3; background: #b35010; height: 80px; }

  .cyan, .red { height: 100px; }


  @media (max-width: 499px) {
    .wrapper {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
    .sidebar, .header, .cyan, .red, .yellow, .green, .footer {
      grid-column: auto;
      grid-row: auto;
      height: auto;
    }
  }


  @media (min-width: 500px) {
    .wrapper { grid-template-columns: 1fr; }
  }


  @media (min-width: 750px) {
    .wrapper { grid-template-columns: 2fr 1fr; }
  }

  @media (min-width: 950px) {
    .wrapper { grid-template-columns: 3fr 1fr; }
  }


  @media (min-width: 1200px) {
    .wrapper { max-width: 1400px; }
    .header { height: 180px; }
    .footer { height: 100px; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="block header"></div>
    <div class="block cyan"></div>
    <div class="block red"></div>
    <div class="block yellow"></div>
    <div class="block green"></div>
    <div class="block sidebar"></div>
    <div class="block footer"></div>
  </div>
</body>
</html>
