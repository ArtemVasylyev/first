<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Float Layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f7f7f7; font-family: Arial, sans-serif; }

  .wrapper {
    max-width: 1200px;
    margin: auto;
    padding: 3px;
  }

  .block { border: 1px solid #ccc; margin: 3px; float: left; }

  .header  { width: calc(100% - 6px); height: 160px; background: #4f9adf; }
  .cyan    { width: 32%; height: 100px; background: #5fd7cf; }
  .red     { width: 32%; height: 100px; background: #e06b6b; }
  .yellow  { width: 32%; height: 210px; background: #ffc400; float: right; }
  .green   { width: 64%; height: 100px; background: #1f9b6f; }
  .sidebar { width: 32%; height: 320px; background: #66696b; float: right; }
  .footer  { width: calc(100% - 6px); height: 80px; background: #b35010; clear: both; }

 
  @media (max-width: 499px) {
    .block {
      float: none;
      width: 100%;
      margin: 3px 0;
    }
    .header, .footer { width: 100%; }
  }

  @media (min-width: 500px) and (max-width: 749px) {
    .cyan, .red, .yellow, .green, .sidebar {
      width: 100%;
      float: none;
    }
  }

  @media (min-width: 750px) and (max-width: 949px) {
    .cyan, .red { width: 48%; }
    .yellow { width: 100%; }
    .green { width: 100%; }
  }

  @media (min-width: 950px) {
    .cyan, .red, .yellow, .green, .sidebar { float: left; }
  }

  @media (min-width: 1200px) {
    .wrapper { max-width: 1400px; }
  }

</style>
</head>
<body>
  <div class="wrapper">
    <div class="block header"></div>

    <div class="block cyan"></div>
    <div class="block red"></div>
    <div class="block yellow"></div>
    <div class="block green"></div>
    <div class="block sidebar"></div>

    <div class="block footer"></div>
  </div>
</body>
</html>
