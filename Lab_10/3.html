<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Layout — grid</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial, Helvetica, sans-serif;margin:20px;background:#fff}
  .grid-wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px;
             grid-template-columns: 1fr 280px;
             grid-template-rows: 160px 120px 120px 72px;}

  .top{grid-column:1/3;background:#4f9adf;border:6px solid #fff}
  .sidebar{grid-row:1/4; grid-column:2/3; background:#66696b;border:6px solid #fff}
  .cyan{grid-column:1/2; grid-row:2/2+1; background:#5fd7cf;border:6px solid #fff}
  .red{grid-column:1/2; justify-self:center; width:36%; background:#e06b6b;border:6px solid #fff; margin-left:35%}
  .yellow{grid-column:1/2; grid-row:2/4; background:#ffc400;border:6px solid #fff; justify-self:end; width:48%}
  .green{grid-column:1/2; grid-row:3/4; background:#1f9b6f;border:6px solid #fff}
  .brown{grid-column:1/3; grid-row:4/5; background:#b35010;border:6px solid #fff}

 
  @media (max-width:820px){
    .grid-wrap{grid-template-columns:1fr; grid-template-rows: auto; }
    .top,.sidebar,.cyan,.red,.yellow,.green,.brown{grid-column:auto; grid-row:auto}
    .sidebar{order:5;height:140px}
    .yellow{width:100%}
  }
</style>
</head>
<body>
  <div class="grid-wrap">
    <div class="top"></div>

    <div class="sidebar"></div>

    <div class="cyan"></div>
    <div class="red"></div>
    <div class="yellow"></div>
    <div class="green"></div>

    <div class="brown"></div>
  </div>
</body>
</html>
