<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Flexbox макет</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #f3f3f3;
    font-family: Arial, sans-serif;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 1200px;
    margin: auto;
    padding: 3px;
  }

  .block {
    border: 1px solid #ccc;
  }

  .header {
    background: #4f9adf;
    height: 160px;
  }

  .middle {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .left {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .row {
    display: flex;
    gap: 3px;
  }

  .cyan   { background: #5fd7cf; flex: 1; height: 100px; }
  .red    { background: #e06b6b; flex: 1; height: 100px; }
  .yellow { background: #ffc400; flex: 1; height: 210px; }
  .green  { background: #1f9b6f; height: 100px; }
  .sidebar{ background: #66696b; flex: 1; min-width: 200px; }
  .footer { background: #b35010; height: 80px; }

  @media (max-width: 499px) {
    .middle { flex-direction: column; }
    .sidebar { order: 1; width: 100%; height: 120px; }
    .row { flex-direction: column; }
  }


  @media (min-width: 500px) {
    .middle { flex-direction: column; }
    .row { flex-direction: row; }
  }


  @media (min-width: 750px) {
    .middle { flex-direction: row; }
    .left { flex: 3; }
  }

  
  @media (min-width: 950px) {
    .cyan, .red { height: 120px; }
    .green { height: 120px; }
  }


  @media (min-width: 1200px) {
    .wrapper { max-width: 1400px; }
    .header { height: 180px; }
    .footer { height: 100px; }
  }

</style>
</head>
<body>
  <div class="wrapper">
    <div class="block header"></div>

    <div class="middle">
      <div class="left">
        <div class="row">
          <div class="block cyan"></div>
          <div class="block red"></div>
          <div class="block yellow"></div>
        </div>
        <div class="block green"></div>
      </div>
      <div class="block sidebar"></div>
    </div>

    <div class="block footer"></div>
  </div>
</body>
</html>
