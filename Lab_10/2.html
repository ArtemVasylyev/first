<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Layout — flexbox</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial, Helvetica, sans-serif;margin:20px;background:#fff}
  .container{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .top{background:#4f9adf;height:160px;border:6px solid #fff}

  .middle{display:flex;gap:12px}
  .main{flex:1; display:flex; flex-direction:column; gap:12px}
  .sidebar{width:220px;background:#66696b;border:6px solid #fff}

  .row-small{display:flex;gap:12px}
  .a{flex:1;background:#5fd7cf;height:88px;border:6px solid #fff}
  .b{flex:0 0 36%;background:#e06b6b;height:88px;border:6px solid #fff}
  .c{flex:1;background:#ffc400;height:200px;border:6px solid #fff}

  .green{background:#1f9b6f;height:120px;border:6px solid #fff}

  .bottom{background:#b35010;height:72px;border:6px solid #fff}

  @media (max-width:720px){
    .middle{flex-direction:column}
    .sidebar{width:100%;height:140px}
    .row-small{flex-direction:column}
    .b{flex-basis:auto}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top"></div>

    <div class="middle">
      <div class="main">
        <div class="row-small">
          <div class="a"></div>
          <div class="b"></div>
          <div class="c"></div>
        </div>

        <div class="green"></div>
      </div>

      <div class="sidebar"></div>
    </div>

    <div class="bottom"></div>
  </div>
</body>
</html>
