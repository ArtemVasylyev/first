<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навігація по проєкту</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
        }
        nav li {
            margin: 10px 0;
        }
        nav a {
            text-decoration: none;
            color: #007bff;
            font-size: 1.2em;
            padding: 8px 15px;
            border: 1px solid #007bff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        nav a:hover {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Головна сторінка</h1>
        <nav>
            <ul>
                <li><a href="/page1">Перейти на Сторінку 1</a></li>
                <li><a href="/page2">Перейти на Сторінку 2</a></li>
                <li><a href="/page3">Перейти на Сторінку 3</a></li>
                <li><a href="/page4">Перейти на Сторінку 4</a></li>
                <li><a href="/page5">Перейти на Сторінку 5</a></li>
                <li><a href="/page6">Перейти на Сторінку 6</a></li>
            </ul>
        </nav>
    </div>
</body>
</html>
